[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awardwatch-pipeline"
version = "0.1.0"
description = "Collects public federal spending records and builds the Award Watch database."
requires-python = ">=3.11"
license = { text = "Source-available; see LICENSE.md at the repository root" }
dependencies = [
  # 2.32.3 and later honour an adapter's own SSL context (http.ContextAdapter).
  "requests>=2.32.3",
  "tzdata>=2024.1",
  # Signs the Search Console service account's JWT (RS256, search_console.py).
  "cryptography>=44",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["awardwatch_pipeline*"]

[tool.setuptools.package-data]
awardwatch_pipeline = ["data/*.csv", "data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# tests/_pending holds the tests of modules not adapted yet; each moves back
# beside its module when that module is.
norecursedirs = [".*", "_pending", "build", "dist", "*.egg"]
