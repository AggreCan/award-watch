# Triggers: a scheduled run at 12:30 UTC, two retry schedules at 16:30 and
# 20:30 UTC, and a manual run (the Actions tab, repository writers only) for
# re-running a night on the newest code; a re-run of an old run keeps its old
# commit. Every source is a bulk file fetched with a conditional request, so
# neither a retry nor a manual run downloads a file that has not changed.
# There is no push trigger, and nothing on the site can start a run. Code on
# main ships with the next run, because this job deploys the Worker from the
# checked-out tree after the data stage.
#
# The retry rule (job "gate"): the 12:30 schedule and a manual run always
# go on to the refresh. At 16:30 and 20:30 the gate downloads status.json from
# R2 and skips the refresh only when it shows a run that finished today (UTC)
# with ok true and the deploy step's outcome success; anything else, a status
# it cannot download or read included, runs the refresh again. So a GitHub
# delay, a runner fault or a Cloudflare API error is retried the same day with
# no one involved, and a clean day costs two gate jobs of a minute each.
#
# Steps: restore the SQLite file from R2 (saved in parts), fetch the
# operator's seed copies (read only while a source's host refuses), run every
# pipeline stage (the buyers, the CanadaBuys tender and award notices and contract
# history, the published contracts, the grants and contributions, the
# lobbying communications, the federal corporations registry, then the
# organizations, the standing offers and supply arrangements, the corporate
# families, the yearly figures and the export), check the database and
# the export, sync the hosted search database (D1, the changed rows only),
# sync the records database the analytics views read (D1, the changed rows
# only), record the Worker version serving traffic, deploy the Worker
# with that data as its assets, check the live site and roll the Worker back
# when the deploy broke it, save the buyer lookup the same-day refresh reads
# and prune that refresh's old rows (docs/intraday.md), tell IndexNow which
# pages changed, check a sample of the government pages the site links to
# (docs/link-sampling.md), save the database (in parts), the public files
# (the static bundle, also in parts, and the CSV downloads) and the review
# files back to R2 (the organization merges list on the 1st and the 16th
# only, under its data date), keep the audience counts of the finished days
# in R2 when the analytics token exists, count the alert sign-ups in the forms database,
# count the account funnel's day and keep it in R2's private views/ prefix for the
# operator's email, append Search Console's daily figures when its key exists, write the
# monthly audience report on the first run of a month (its figures join the
# operator's line, never LAST_RUN.md), run the monthly expiry
# checks on the first of a month, write the run status, and report the items
# needing attention (failed run, one GitHub issue).
#
# Audience and account figures (visitors, page views, search clicks, sign-ups
# and the like) stay in R2's private views/ prefix and the operator's
# email. This run log is public, LAST_RUN.md is committed to the public
# repository, and status.json is printed in this log, so no step prints such
# a figure and neither file holds one; for those steps they carry an outcome
# word.
#
# What a failure does (awardwatch_pipeline/nightly.py and resilience.py hold the
# checks):
# - A backup that exists but cannot be downloaded or used stops the run before
#   the pipeline, so an empty database never rebuilds the site and never
#   replaces the backup. A damaged newest backup (a part that fails its
#   manifest's hash, a gzip that does not end, a database that fails its
#   check) falls back to the previous one; when both nightly sets are missing
#   or damaged, to the newest weekly snapshot (an attention item); only when
#   nothing exists anywhere does the run start from nothing.
# - A deploy after which the site answers 500 to 599 twice is rolled back to
#   the version recorded before it (deploy_rolled_back: true, an attention
#   item); the database is still saved, and the next retry deploys again. An
#   answer from the edge (403, a challenge page) proves nothing and changes
#   nothing.
# - A stage that fails is recorded and the run goes on; the export is checked
#   before it is deployed, so broken or empty data is never published and the
#   site keeps its last good deploy.
# - The database is checked before it is saved, and last night's backup is
#   kept as the previous one before it is replaced.
# - The status file is written whatever happened, so the site's daily check
#   always has something current to read.
# - An audience roll-up that fails is reported (views_rollup: failed) and
#   caught up the next night; it never stops the run, and a summary that
#   could not be downloaded is never replaced. The same holds for the Search
#   Console import (search_console: failed) and its file, and for the monthly
#   report (views_report: failed), which the next run writes instead.
# - A count of the alert sign-ups that cannot be read sets the status's
#   interest to "failed" and adds a notice: information, never an item
#   needing attention and never a failed run. The next run counts again.
# - An account funnel count that cannot be read writes n/a in the operator's
#   line; a funnel record that cannot be saved to R2 is a notice
#   (funnel: failed), never an item needing attention. The next run counts
#   its own day, and a record R2 holds is never replaced by a shorter one.
# - A search database sync that fails is reported (search_sync: failed, an
#   item needing attention) and stops nothing: the deploy goes ahead, the
#   search page answers from what D1 already holds, and the next night sends
#   the same changes again.
# - A records database sync that fails is reported the same way (records_sync:
#   failed, an item needing attention) and stops nothing: the analytics views
#   answer from what D1 already holds. While the database is not created yet
#   the step writes "no database", a notice.
# - An IndexNow submission that fails is reported (indexnow in the run status)
#   and never stops the run; only a rejection (the key file or the payload is
#   wrong) is an item needing attention.
# - A buyer lookup for the same-day refresh that cannot be saved, or a prune
#   of its old rows that fails, is a notice (intraday_lookup or
#   intraday_prune: failed in the run status) and stops nothing: the intraday
#   job keeps the lookup R2 has, and the site shows only the rows read since
#   the data date whatever the prune did.
# - A sampled government link that answers 404 or 410 is an item needing
#   attention (listed in it, up to ten) and a notice; the run stays ok and
#   the site keeps its link. A link sample that fails, or that its step's
#   time limit stops, is a notice (link_sample: failed) and stops nothing:
#   the next night draws another sample.
# - A fault in the retry gate, the version record, the smoke test, the expiry
#   checks or the issue update never stops the run: the gate then runs the
#   refresh, a missing version means no rollback tonight, and each outcome is
#   in status.json.
# - A notice (a buyer spelling the seed does not map yet, a source file not
#   published yet, a stage not built) is information, never an item needing
#   attention: it goes to status.json's notices, LAST_RUN.md and the daily
#   check's email, never fails the last step or opens the issue, and leaves
#   the run ok, so no retry follows: a retry would read the same files again.
#
# Secrets on the project account: CLOUDFLARE_API_TOKEN (Workers + R2 + D1),
# CLOUDFLARE_ACCOUNT_ID. Optional: CLOUDFLARE_ANALYTICS_TOKEN (Account
# Analytics Read only, the audience roll-up, docs/search-engines.md section 6;
# without it the step does nothing); GSC_SERVICE_ACCOUNT_JSON (a Google
# service account's JSON key, added as a user of the Search Console property;
# without it the import reports "no credentials"); MAIL_TEST_TO (the live mail
# check's test inbox, passed to the Worker at the deploy; a secret so the
# address is masked in this public run log; docs/mail.md). The Worker secret
# VIEWS_SALT_KEY (the daily visitor code) is set with wrangler, not here; the
# roll-up counts no unique visitors without it. The Worker secret
# MAIL_CHECK_TOKEN (the mail-check workflow's bearer token) is set the same way.
# Variables: SITE_URL, CONTACT (the user agent's site and contact page);
# optional INDEXNOW_ENABLED, set to false to stop the IndexNow submission (it
# runs unless the variable reads exactly "false"; the key is in the code, so
# it needs no secret); optional GSC_SITE, the Search Console property when it
# is not the domain property sc-domain:<site host>.
# The repository is public, so Actions minutes are unlimited. The longest
# nights are the weekly re-reads of the published contracts (655 MB) and the
# grants (2.4 GB), streamed to disk and deleted after the load; the job must
# still finish before the next day's 12:30 run.

name: nightly

on:
  schedule:
    # 12:30 UTC: CanadaBuys regenerates its daily files between about 05:30
    # and 07:15 Ottawa time (10:30 to 12:15 UTC in winter, an hour earlier in
    # summer), so this run reads the same morning's files whatever the clock
    # change, and the site carries them by about 08:30 Ottawa time in winter.
    - cron: "30 12 * * *"
    # Retries, which the gate job skips when today's run finished clean. They
    # stay inside the same UTC day as the main run because the gate compares
    # dates. The entry above must stay exactly "30 12 * * *": the gate tells
    # the schedules apart by that string.
    - cron: "30 16 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch:

# contents: write only so a step can record the run date; GitHub pauses a
# schedule after 60 days without repository activity. issues: write for the
# one run-attention issue the last step opens, updates and closes.
permissions:
  contents: write
  issues: write

# Never let two runs overlap, even if one is delayed past the next schedule.
# A retry queued behind a long run waits for it, then its gate reads the
# status that run wrote. deploy-site.yml uses the same group, so a site-only
# deploy never runs during a refresh (pipeline/tests/test_site_deploy.py
# checks that both keep it).
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Decides whether this trigger has anything to do (the retry rule in the
  # header). Every step that could fail is allowed to: a gate that cannot
  # decide leaves skip unset, and the refresh runs. The download uses the
  # site's pinned Wrangler like every other R2 read.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RETRY: ${{ github.event_name == 'schedule' && github.event.schedule != '30 12 * * *' }}
      WRANGLER: ${{ github.workspace }}/site/node_modules/.bin/wrangler
      BUCKET: awardwatch-data
    steps:
      - name: Main schedule or manual run, so the refresh goes ahead
        if: ${{ env.RETRY != 'true' }}
        run: echo "Not a retry trigger; the refresh runs."
      - uses: actions/checkout@v4
        if: ${{ env.RETRY == 'true' }}
        continue-on-error: true
      - uses: actions/setup-python@v5
        if: ${{ env.RETRY == 'true' }}
        continue-on-error: true
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        if: ${{ env.RETRY == 'true' }}
        continue-on-error: true
        with:
          node-version: "22"
      - name: Install the site's tools
        if: ${{ env.RETRY == 'true' }}
        continue-on-error: true
        working-directory: site
        run: npm ci
      # nightly.py needs nothing beyond the standard library for the gate,
      # so the pipeline is not installed here.
      - name: Read today's run status from R2
        id: decide
        if: ${{ env.RETRY == 'true' }}
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          mkdir -p data/gate
          if ! "$WRANGLER" r2 object get --remote "$BUCKET/status.json" --file data/gate/status.json > data/gate/get.log 2>&1; then
            echo "status.json could not be downloaded, so the refresh runs:"
            cat data/gate/get.log
            rm -f data/gate/status.json
          fi
          python -m awardwatch_pipeline.nightly gate --status data/gate/status.json --today "$(date -u +%Y-%m-%d)"

  refresh:
    needs: gate
    # Runs unless the gate found today's run already clean. !cancelled()
    # rather than the implied success(), so a gate job that failed outright
    # skips nothing.
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # GitHub ends a hosted job at six hours whatever this says, and a job
    # ended that way skips the deploy, the backup and the status file.
    timeout-minutes: 350
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWARDWATCH_SITE_URL: ${{ vars.SITE_URL }}
      AWARDWATCH_CONTACT: ${{ vars.CONTACT }}
      # The site's pinned Wrangler (package-lock.json) for every R2 call as well
      # as the deploy, so a new Wrangler release cannot change how the backup
      # is read or written. Installed by the "site's tools" step.
      WRANGLER: ${{ github.workspace }}/site/node_modules/.bin/wrangler
      BUCKET: awardwatch-data
    steps:
      # Fail in seconds, not after an hour of downloads, until the account is wired up.
      - name: Check that the Cloudflare secrets exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; nothing to do."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Editable, because config.py finds schema.sql and data/ relative to its own
      # file; a regular install would look for them inside site-packages.
      - name: Install the pipeline
        run: pip install -e ./pipeline
      - name: Install the site's tools
        working-directory: site
        run: npm ci

      # The download cache (the CanadaBuys files' validators, the CKAN
      # organization answers, the federal corporations extract) persists
      # between runs through the Actions cache, so weekly and monthly
      # revalidation means what it says instead of a fresh download every
      # night. A new key each run saves the latest state; restore-keys picks
      # the newest previous one. Restore and save are separate steps so the
      # cache is saved even on a night that reports a failure; a cache service
      # fault only costs a fresh download.
      - name: Restore the download cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: data/raw/cache
          key: raw-cache-${{ github.run_id }}
          restore-keys: raw-cache-

      # The database travels gzipped, without its secondary indexes, and in
      # parts of at most 250 MiB (the save step's pack): Wrangler refuses a
      # single upload above 300 MiB. A set is <name>.parts, the manifest that
      # lists each part's SHA-256 in order, and the parts it names; the
      # pipeline puts the indexes back when it first opens the restored file.
      # --remote on every r2 command: without it Wrangler 4 reads and writes a
      # local simulated bucket on the runner, which is thrown away with the job.
      # Each download is tried three times; "does not exist" ends the tries,
      # since that is an answer, not an outage. Only the part names of the two
      # nightly sets are fetched, whatever a manifest holds. A manifest R2 says
      # does not exist leads to the single file a backup was saved as before
      # the split. The restore command decides: it joins the parts, checks each
      # hash, and moves on to the previous set when one fails. When R2
      # answered that both nightly backups are missing or both are damaged,
      # the command itself lists backups/weekly/ through the R2 REST API
      # (Wrangler has no listing command) with CLOUDFLARE_API_TOKEN from the
      # job's environment, downloads the newest snapshot's parts the same way,
      # and records source "weekly" and its upload time in restore.json.
      - name: Restore the database from R2
        id: restore
        run: |
          mkdir -p data/restore data/out
          fetch() {
            key="$1"
            for attempt in 1 2 3; do
              if "$WRANGLER" r2 object get --remote "$BUCKET/$key" --file "data/restore/$key" > "data/restore/$key.log" 2>&1; then
                echo 0 > "data/restore/$key.exit"
                return 0
              fi
              echo 1 > "data/restore/$key.exit"
              if grep -qi "specified key does not exist" "data/restore/$key.log"; then return 0; fi
              sleep 20
            done
          }
          fetch_set() {
            base="$1"
            fetch "$base.parts"
            if [ "$(cat "data/restore/$base.parts.exit")" = "0" ]; then
              for part in $(awk '{print $2}' "data/restore/$base.parts" | grep -E '^awardwatch\.sqlite(\.prev)?\.gz\.[0-9]{3}$'); do
                fetch "$part"
              done
            elif grep -qi "specified key does not exist" "data/restore/$base.parts.log"; then
              fetch "$base"
            fi
          }
          fetch_set awardwatch.sqlite.gz
          fetch_set awardwatch.sqlite.prev.gz
          python -m awardwatch_pipeline.nightly restore --dir data/restore --db data/awardwatch.sqlite --out data/out/restore.json \
            --bucket "$BUCKET"
          # The parts are joined and checked; only the joined backup is read again
          # (prev-set, in the save step). The runner's disk is the tightest
          # resource of the night, so the parts go now.
          rm -f data/restore/*.gz.[0-9][0-9][0-9]
          df -h --output=avail,pcent . | tail -1 | sed 's/^/disk after the restore: /'

      # The operator's own copy of a source file whose host refuses this
      # project's requests (the Registry of Lobbyists' zip), kept in R2 under
      # seeds/. The lobbying stage reads it only while the registry's host
      # refuses (config.SEEDS_DIR, sources/lobbying.py). A copy that cannot be
      # fetched leaves the stage to the Internet Archive's capture or to
      # recording the refusal, so the step never stops the run. No step uploads
      # data/seeds: a new copy goes to R2 by hand.
      - name: Fetch the operator's seed copies
        continue-on-error: true
        run: |
          f=communications_ocl_cal.zip
          mkdir -p data/seeds
          # A .part first, so a failed download never leaves a broken copy for the stage.
          if ! "$WRANGLER" r2 object get --remote "$BUCKET/seeds/$f" --file "data/seeds/$f.part"; then
            rm -f "data/seeds/$f.part"
            exit 1
          fi
          mv "data/seeds/$f.part" "data/seeds/$f"
          ls -l data/seeds

      # A non-zero exit marks the run failed, and the steps below still check
      # and save what the run produced.
      - name: Run every stage
        id: pipeline
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/out/run_started.txt
          python -m awardwatch_pipeline run --db data/awardwatch.sqlite

      - name: Check the database and the export
        id: verify
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          python -m awardwatch_pipeline.nightly verify --db data/awardwatch.sqlite --static data/out/static \
            --started-file data/out/run_started.txt --restore data/out/restore.json --out data/out/verify.json

      # The hosted search database, D1 awardwatch-search (docs/hosted-search.md):
      # search-sync compares tonight's organizations and buyers with the
      # ledger in the pipeline database and writes the changed rows as SQL
      # batches (batches.txt lists them in order). Wrangler applies the schema
      # (IF NOT EXISTS throughout, so it changes nothing on a database that has
      # it) and each batch, then reads the row counts back; search-check
      # compares them with the manifest, and only then does search-synced
      # record the ledger. The ledger travels with the database, so this runs
      # before the save. search-sync writes "failed" to the outcome file first
      # and search-synced replaces it, so a step stopped anywhere reads as
      # failed: an item needing attention (search_sync in the run status) that
      # stops nothing. The deploy goes ahead and the search page answers from
      # what D1 already holds; the next night sends the same changes again.
      - name: Sync the search database
        id: search
        if: ${{ !cancelled() && steps.verify.outputs.export_ok == 'true' && steps.verify.outputs.db_ok == 'true' }}
        continue-on-error: true
        timeout-minutes: 60
        working-directory: site
        run: |
          out=../data/out/search
          python -m awardwatch_pipeline search-sync --db ../data/awardwatch.sqlite --static ../data/out/static --out "$out"
          "$WRANGLER" d1 execute awardwatch-search --remote --yes --file ../pipeline/search_schema.sql
          for batch in $(cat "$out/batches.txt"); do
            echo "Applying $batch"
            "$WRANGLER" d1 execute awardwatch-search --remote --yes --file "$out/$batch"
          done
          "$WRANGLER" d1 execute awardwatch-search --remote --json --command "SELECT (SELECT COUNT(*) FROM search_orgs) AS orgs, (SELECT COUNT(*) FROM search_buyers) AS buyers" > "$out/count.json"
          python -m awardwatch_pipeline search-check --db ../data/awardwatch.sqlite --manifest "$out/manifest.json" --counts "$out/count.json"
          python -m awardwatch_pipeline search-synced --db ../data/awardwatch.sqlite --manifest "$out/manifest.json"

      # The records database, D1 awardwatch-records (docs/analytics.md), the
      # analytics views' data: the search sync's shape. records-sync stages
      # tonight's changed rows in the pipeline database and writes them as SQL
      # batches; Wrangler applies the schema and each batch, then reads each
      # table's row count back; records-check compares them with the manifest;
      # only then does Wrangler apply finish.sql (the database is ready and
      # describes tonight's data date) and records-synced record the ledger,
      # which travels with the database, so this runs before the save. While
      # wrangler.jsonc still holds the placeholder id the step sends nothing
      # and writes "no database", a notice. records-sync writes "failed" first
      # and records-synced replaces it, so a step stopped anywhere reads as
      # failed: an item needing attention (records_sync in the run status)
      # that stops nothing; the views answer from what D1 already holds and
      # the next night sends the same changes again. A full load runs to
      # hundreds of batches, hence the longer limit; the batch files go once
      # applied, to spare the runner's disk. The static export gives the
      # radar's 12-month window (rec_expiring, and its provinces in
      # rec_expiring_prov), so this runs after it.
      - name: Sync the records database
        id: records
        if: ${{ !cancelled() && steps.verify.outputs.export_ok == 'true' && steps.verify.outputs.db_ok == 'true' }}
        continue-on-error: true
        # The first night after the record tables land writes them and the published contracts' pages (about 1.1 GB of SQL in about 230 batches); a timeout records nothing, so the next night would resend it all.
        timeout-minutes: 300
        working-directory: site
        run: |
          out=../data/out/records
          mkdir -p "$out"
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' wrangler.jsonc; then
            echo "The records database is not created yet (wrangler.jsonc holds the placeholder id); nothing sent"
            printf 'no database\n' > "$out/last_outcome.txt"
            exit 0
          fi
          python -m awardwatch_pipeline records-sync --db ../data/awardwatch.sqlite --static ../data/out/static --out "$out"
          "$WRANGLER" d1 execute awardwatch-records --remote --yes --file ../pipeline/records_schema.sql
          for batch in $(cat "$out/batches.txt"); do
            echo "Applying $batch"
            "$WRANGLER" d1 execute awardwatch-records --remote --yes --file "$out/$batch"
            rm -f "$out/$batch"
          done
          "$WRANGLER" d1 execute awardwatch-records --remote --json --command "SELECT (SELECT COUNT(*) FROM records) AS records, (SELECT COUNT(*) FROM rec_orgs) AS rec_orgs, (SELECT COUNT(*) FROM rec_buyers) AS rec_buyers, (SELECT COUNT(*) FROM rec_buyer_quarters) AS rec_buyer_quarters, (SELECT COUNT(*) FROM rec_segment_years) AS rec_segment_years, (SELECT COUNT(*) FROM rec_buyer_years) AS rec_buyer_years, (SELECT COUNT(*) FROM rec_due) AS rec_due, (SELECT COUNT(*) FROM rec_details) AS rec_details, (SELECT COUNT(*) FROM rec_classes) AS rec_classes, (SELECT COUNT(*) FROM rec_expiring) AS rec_expiring, (SELECT COUNT(*) FROM rec_contracts) AS rec_contracts, (SELECT COUNT(*) FROM rec_gsin) AS rec_gsin, (SELECT COUNT(*) FROM rec_events) AS rec_events, (SELECT COUNT(*) FROM rec_instruments) AS rec_instruments, (SELECT COUNT(*) FROM rec_holders) AS rec_holders, (SELECT COUNT(*) FROM rec_expiring_prov) AS rec_expiring_prov, (SELECT COUNT(*) FROM rec_contract_indigenous) AS rec_contract_indigenous" > "$out/count.json"
          python -m awardwatch_pipeline records-check --db ../data/awardwatch.sqlite --manifest "$out/manifest.json" --counts "$out/count.json"
          "$WRANGLER" d1 execute awardwatch-records --remote --yes --file "$out/finish.sql"
          python -m awardwatch_pipeline records-synced --db ../data/awardwatch.sqlite --manifest "$out/manifest.json"

      - name: Bundle the static data for the site
        id: bundle
        if: ${{ !cancelled() && steps.verify.outputs.export_ok == 'true' }}
        run: |
          rm -rf site/public/data
          cp -r data/out/static site/public/data
          tar -czf data/out/static.tar.gz -C data/out static

      # The version serving traffic before tonight's deploy, kept so a deploy
      # that breaks the site can be put back. deployments status names the
      # version carrying the traffic; versions list would also show a version
      # uploaded without being deployed. live-version passes on only a
      # well-formed version id. A failure here means no rollback tonight and
      # nothing more.
      - name: Record the live Worker version
        id: version
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        continue-on-error: true
        working-directory: site
        run: |
          mkdir -p ../data/out/deploy
          "$WRANGLER" deployments status --json > ../data/out/deploy/before.json 2> ../data/out/deploy/before.log || cat ../data/out/deploy/before.log
          python -m awardwatch_pipeline.nightly live-version --file ../data/out/deploy/before.json --out ../data/out/deploy/version_before.txt

      # A failed deploy leaves the live site on its previous version. The
      # asset upload (thousands of small files) meets a transient API error
      # now and then after Wrangler's own retries, so the whole deploy is
      # tried three times with a pause between; files stored by a failed
      # attempt are not uploaded again, since assets are content-addressed.
      # The landing page's Brandfetch client id (docs/landing.md) goes to the
      # Worker as a variable, as the site-only deploy passes it: a deploy
      # without it would drop it, since wrangler.jsonc does not hold it. An
      # empty repository variable passes nothing. The live mail check's test
      # inbox (docs/mail.md) goes the same way from the repository secret
      # MAIL_TEST_TO, masked in the log; unset, nothing is passed.
      - name: Deploy the Worker with the new data as assets
        id: deploy
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        working-directory: site
        env:
          BRANDFETCH_CLIENT_ID: ${{ vars.BRANDFETCH_CLIENT_ID }}
          MAIL_TEST_TO: ${{ secrets.MAIL_TEST_TO }}
        run: |
          set --
          if [ -n "$BRANDFETCH_CLIENT_ID" ]; then set -- --var "BRANDFETCH_CLIENT_ID:$BRANDFETCH_CLIENT_ID"; fi
          if [ -n "$MAIL_TEST_TO" ]; then set -- "$@" --var "MAIL_TEST_TO:$MAIL_TEST_TO"; fi
          for attempt in 1 2 3; do
            if npx wrangler deploy "$@"; then exit 0; fi
            echo "deploy attempt $attempt failed; trying again in two minutes"
            sleep 120
          done
          exit 1

      # After a deploy that worked: the home, open tenders and data pages and
      # one organization profile (the first of stats.json's
      # top_organizations_year), fetched from outside with the pipeline's user
      # agent, each page that fails fetched again 30 seconds later. "ok":
      # every page 200, and home and data show tonight's data date. "broken":
      # a page answered 500 to 599 both times. "unverifiable": anything else,
      # above all a 403 or a challenge page from the edge (the dashboard's
      # rules may refuse a cloud address), which is never a reason to roll
      # back. The verdict lands in the run status as smoke.
      - name: Check the live site
        id: smoke
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p data/out/deploy
          data_date=$(python -c 'import json, sys; print(json.load(open(sys.argv[1])).get("data_as_of") or "")' data/out/static/stats.json || true)
          python -m awardwatch_pipeline.nightly smoke --base-url "${AWARDWATCH_SITE_URL:-https://awardwatch.ca}" \
            --data-date "$data_date" --stats data/out/static/stats.json --out data/out/deploy/smoke.json

      # Only when the Worker itself answered with server errors. A rollback
      # puts the version recorded above, with its own copy of the data, back
      # on all the traffic; bound resources (D1, R2) are not touched. The
      # database is still saved below, and the next retry trigger deploys
      # again because the run is not ok. The outcome reads "failed" until the
      # rollback has gone through. The id comes through the environment and
      # was checked as a version id, so it cannot change the command.
      - name: Roll the Worker back when the deploy broke the site
        id: rollback
        if: ${{ !cancelled() && steps.smoke.outputs.verdict == 'broken' }}
        continue-on-error: true
        working-directory: site
        env:
          VERSION_ID: ${{ steps.version.outputs.version_id }}
        run: |
          out=../data/out/deploy
          echo "failed" > "$out/rollback.txt"
          if [ -z "$VERSION_ID" ]; then
            echo "no version recorded" > "$out/rollback.txt"
            echo "No version was recorded before the deploy, so there is none to roll back to."
            exit 1
          fi
          for attempt in 1 2 3; do
            if "$WRANGLER" rollback "$VERSION_ID" --message "Nightly smoke test failed after the deploy" --yes; then
              echo "rolled back" > "$out/rollback.txt"
              exit 0
            fi
            echo "rollback attempt $attempt failed; trying again in 30 seconds"
            sleep 30
          done
          exit 1

      # The deploy copy of the export (site/public/data, 2.9 GB on 2026-11-02) is
      # read only by the deploy; once the deploy, the live check and any
      # rollback are done it is freed, because the database pack later in the
      # run failed with "database or disk is full" when the copy, the export,
      # the bundle and the restored backup all sat on the runner at once.
      - name: Free the deploy copy of the export
        if: ${{ !cancelled() }}
        run: |
          rm -rf site/public/data
          df -h --output=avail,pcent . | tail -1 | sed 's/^/disk after the deploy: /'

      # The same-day refresh (docs/intraday.md, .github/workflows/intraday.yml)
      # runs without the database; it resolves buyer spellings with this file
      # instead: every spelling the buyers stage has resolved, the titles,
      # acronyms and keys its rules match, the listed buyers' names and the
      # data date, gzipped (intraday lookup). Only after a deploy that worked
      # and was not found broken, so the buyers it links are the ones the live
      # site has pages for; otherwise R2 keeps the lookup of the last good
      # deploy. The outcome reads "failed" until the file is in R2. A failure
      # is a notice in the run status (intraday_lookup), never an item needing
      # attention: the intraday job keeps the lookup it has. Once the file is
      # in R2 its size goes to lookup_bytes.txt and the log, and the run
      # status records it (intraday_lookup_bytes); the site's daily check
      # flags a lookup over 2,000,000 bytes, since every intraday run
      # downloads and parses it (58,773 bytes on 2026-11-03).
      - name: Save the buyer lookup for the same-day refresh
        id: intraday_lookup
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.smoke.outputs.verdict != 'broken' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          out=data/out/intraday
          mkdir -p "$out"
          echo "failed" > "$out/lookup_outcome.txt"
          python -m awardwatch_pipeline.intraday lookup --db data/awardwatch.sqlite --static data/out/static --out "$out/lookup.json.gz"
          for attempt in 1 2 3; do
            if "$WRANGLER" r2 object put --remote "$BUCKET/intraday/lookup.json.gz" --file "$out/lookup.json.gz"; then
              echo "saved" > "$out/lookup_outcome.txt"
              wc -c < "$out/lookup.json.gz" > "$out/lookup_bytes.txt"
              echo "buyer lookup saved to R2: $(cat "$out/lookup_bytes.txt") bytes"
              exit 0
            fi
            sleep $((20 * attempt))
          done
          exit 1

      # The same-day notices first read more than two days ago, and the
      # intraday run rows older than 30 days, deleted from the search
      # database (intraday prune). The site shows only the notices read since
      # the data date, so a prune that fails changes no page: a notice in the
      # run status (intraday_prune), and the next night deletes them. From the
      # site folder, where wrangler.jsonc names the database.
      - name: Prune the same-day notices
        id: intraday_prune
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        working-directory: site
        run: |
          out=../data/out/intraday
          mkdir -p "$out"
          echo "failed" > "$out/prune_outcome.txt"
          python -m awardwatch_pipeline.intraday prune --out "$out/prune.sql"
          "$WRANGLER" d1 execute awardwatch-search --remote --yes --file "$out/prune.sql"
          echo "pruned" > "$out/prune_outcome.txt"

      # IndexNow (docs/search-engines.md, section 5): Bing and the other engines
      # that take it (Google does not) hear about tonight's changed pages
      # without waiting for a crawl. The command sends the pages whose rows
      # changed since the run's start (run_started.txt, written as the
      # pipeline step began, in the same form as the updated_at columns) and
      # the pages that follow the nightly data, at most 20,000 a night in
      # batches of 10,000, to api.indexnow.org. An engine checks the request
      # against the key file at the site's root (site/public/<key>.txt), which
      # this deploy has just published; the key is in the code, so no secret
      # is needed. Only after a deploy that worked and was not found broken,
      # so the engines are pointed at pages the site serves. "failed" is
      # written first, so a step stopped by its time limit reads as failed.
      # Exits 1 only on a rejection (the step shows red; an attention item);
      # a rate limit or an outage is recorded and nothing more. Never stops
      # the run. INDEXNOW_ENABLED=false turns it off.
      - name: Tell IndexNow which pages changed
        id: indexnow
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.smoke.outputs.verdict != 'broken' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          INDEXNOW_ENABLED: ${{ vars.INDEXNOW_ENABLED }}
        run: |
          out=data/out/indexnow
          mkdir -p "$out"
          echo "failed" > "$out/last_outcome.txt"
          if [ "$INDEXNOW_ENABLED" = "false" ]; then
            echo "INDEXNOW_ENABLED is false; nothing sent."
            echo "off" > "$out/last_outcome.txt"
            exit 0
          fi
          since=$(cat data/out/run_started.txt 2>/dev/null || true)
          python -m awardwatch_pipeline.nightly indexnow --db data/awardwatch.sqlite --since "$since" \
            --site-url "${AWARDWATCH_SITE_URL:-https://awardwatch.ca}"

      # A sample of the government pages the site links to (docs/link-sampling.md):
      # about 40 links drawn from the database across the kinds of link
      # (CanadaBuys notices, the contracts and grants searches, the lobbying
      # registry, open.canada.ca), seeded by the data date, and checked one at
      # a time with HEAD (GET when HEAD answers 405 or 501) and the pipeline's
      # user agent, at most one retry each. After the deploy, so it never delays
      # publishing, and before the database is saved, because the checks
      # (link_checks, kept 60 days) travel in the backup. "failed" is written
      # first; the command replaces it with "checked N, M broken" and lists the
      # 404s and 410s in broken.json. A broken link is an item needing
      # attention and a line in the daily check's email; the run stays ok. The
      # command starts no check after eight minutes, so it writes what it
      # checked inside the step's limit. Never stops the run.
      - name: Sample the outbound links
        id: link_sample
        if: ${{ !cancelled() && steps.verify.outputs.db_ok == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          out=data/out/links
          mkdir -p "$out"
          echo "failed" > "$out/last_outcome.txt"
          python -m awardwatch_pipeline link-sample --db data/awardwatch.sqlite --out "$out"

      # Only a database that passed its checks is saved, whether or not the
      # deploy worked, so a night's loads are kept even when the site could
      # not be updated. Last night's backup becomes the previous one first;
      # when the run started from the previous one (the newest was damaged)
      # that copy is left as it is.
      # The pack copies the database with VACUUM INTO (which also takes rows
      # still in the write-ahead log), drops the secondary indexes, checks the
      # copy, gzips it and splits it into parts of at most 250 MiB with their
      # manifest. Each set goes up part by part in order and its manifest last,
      # so a save that stops part way leaves a set whose hashes fail, and the
      # next restore takes the previous one. Parts left in R2 by an earlier,
      # larger set are never read: the manifest names the parts that belong.
      # Every upload is tried three times; one still failing fails the step.
      - name: Save the database to R2
        id: save_db
        if: ${{ !cancelled() && steps.verify.outputs.db_ok == 'true' }}
        run: |
          put() {
            local attempt
            for attempt in 1 2 3; do
              if "$WRANGLER" r2 object put --remote "$1" --file "$2"; then return 0; fi
              echo "::warning::upload of $1 failed (attempt $attempt of 3)"
              sleep $((20 * attempt))
            done
            return 1
          }
          put_set() {
            dir="$1"
            base="$2"
            for part in $(awk '{print $2}' "$dir/$base.parts"); do
              put "$BUCKET/$part" "$dir/$part"
            done
            put "$BUCKET/$base.parts" "$dir/$base.parts"
          }
          python -m awardwatch_pipeline.nightly pack --db data/awardwatch.sqlite --out data/out/awardwatch.sqlite.gz
          source=$(python -c 'import json; print(json.load(open("data/out/restore.json"))["source"])')
          if [ "$source" = "backup" ]; then
            python -m awardwatch_pipeline.nightly prev-set --dir data/restore --out-dir data/out/prev
            put_set data/out/prev awardwatch.sqlite.prev.gz
          fi
          put_set data/out awardwatch.sqlite.gz

      # Weekly snapshots, kept eight weeks. The nightly save keeps only tonight's
      # backup and the previous night's, so a fault noticed later than that would
      # reach every copy. Sundays (UTC) only; the slot is the count of whole weeks
      # since 1970-01-01 modulo 8, so each snapshot replaces the one from eight
      # weeks before and nothing has to be listed or pruned. A snapshot is a set
      # of parts like the nightly backup (db-slot-<n>.sqlite.gz.000 ... and
      # db-slot-<n>.sqlite.gz.parts, the manifest last). The site's own D1
      # database (the forms and the alert sign-ups) goes with it, exported
      # whole. The operator's machine pulls the newest backup and the D1
      # export into a folder off this account each week.
      - name: Weekly snapshot (Sundays UTC, kept eight weeks)
        id: snapshot
        if: ${{ !cancelled() && steps.save_db.outcome == 'success' }}
        continue-on-error: true
        working-directory: site
        run: |
          if [ "$(date -u +%u)" != "7" ]; then echo "Not Sunday (UTC); no snapshot tonight."; exit 0; fi
          slot=$(( $(date -u +%s) / 604800 % 8 ))
          base="db-slot-$slot.sqlite.gz"
          python -m awardwatch_pipeline.nightly split --src ../data/out/awardwatch.sqlite.gz --base "$base" \
            --out-dir ../data/out/weekly
          for part in $(awk '{print $2}' "../data/out/weekly/$base.parts"); do
            "$WRANGLER" r2 object put --remote "$BUCKET/backups/weekly/$part" --file "../data/out/weekly/$part"
          done
          "$WRANGLER" r2 object put --remote "$BUCKET/backups/weekly/$base.parts" --file "../data/out/weekly/$base.parts"
          "$WRANGLER" d1 export award-watch --remote --output ../data/out/d1.sql
          gzip -c ../data/out/d1.sql > ../data/out/d1.sql.gz
          "$WRANGLER" r2 object put --remote "$BUCKET/backups/weekly/d1-slot-$slot.sql.gz" --file ../data/out/d1.sql.gz
          "$WRANGLER" r2 object put --remote "$BUCKET/backups/weekly/d1-latest.sql.gz" --file ../data/out/d1.sql.gz
          date -u +"%Y-%m-%d" > ../data/out/slot.txt
          "$WRANGLER" r2 object put --remote "$BUCKET/backups/weekly/slot-$slot.txt" --file ../data/out/slot.txt
          echo "Snapshot saved to slot $slot."

      # The downloads and the bundle match what was deployed, so they are saved
      # only after a deploy that worked and was not found broken. The bundle
      # (static.tar.gz, the folder the deploy published, read back by the
      # site-only deploy) passes Wrangler's 300 MiB limit on a single upload,
      # so it travels as a set like the database: split writes
      # static.tar.gz.000, .001, ... of at most 250 MiB and the manifest
      # static.tar.gz.parts, which lists each part's SHA-256 in order. The
      # parts go up in order and the manifest last, so a reader never finds
      # a manifest whose parts are not all in R2. The CSV files and their
      # SHA256SUMS go under downloads/, the only prefix the site's /downloads
      # route reads.
      - name: Save the public files to R2
        id: save_files
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.smoke.outputs.verdict != 'broken' }}
        # Each upload is tried three times, 20, 40 and 60 seconds apart: the
        # API answers an occasional 524 on a single put, and one such answer
        # must not leave the rest of the files a day old. A file still failing
        # after three tries is named, the loop goes on, and the step fails at
        # the end so the attention item says so. The bundle's manifest is the
        # last name in its loop, so a part that fails ends the loop before the
        # manifest goes up (the parts after it would be of no use without
        # one); the CSV files still go up. A split that fails saves none of
        # the bundle and fails the step the same way.
        run: |
          put() {
            local attempt
            for attempt in 1 2 3; do
              if "$WRANGLER" r2 object put --remote "$1" --file "$2"; then return 0; fi
              echo "::warning::upload of $1 failed (attempt $attempt of 3)"
              sleep $((20 * attempt))
            done
            return 1
          }
          failed=""
          split_failed=""
          if python -m awardwatch_pipeline.nightly split --src data/out/static.tar.gz --base static.tar.gz --out-dir data/out/bundle; then
            for name in $(awk '{print $2}' data/out/bundle/static.tar.gz.parts) static.tar.gz.parts; do
              if ! put "$BUCKET/$name" "data/out/bundle/$name"; then
                failed="$failed $name"
                break
              fi
            done
          else
            split_failed=yes
          fi
          for f in data/out/csv/*.csv data/out/csv/SHA256SUMS; do
            [ -f "$f" ] || continue
            put "$BUCKET/downloads/$(basename "$f")" "$f" || failed="$failed $(basename "$f")"
          done
          if [ -n "$split_failed" ]; then
            echo "::error::static.tar.gz could not be split into parts (the split line above says why), so the bundle was not saved"
          fi
          if [ -n "$failed" ]; then
            echo "::error::not saved to R2 after three tries:$failed"
          fi
          if [ -n "$failed" ] || [ -n "$split_failed" ]; then exit 1; fi

      # The names the person test withheld from tonight's records (the
      # CanadaBuys stages list them in data/out/review/<stage>-persons.txt,
      # never in the run log), for the operator to review: uploaded to the
      # bucket under review/, which no route on the site reads, and nowhere
      # else. They never enter the bundle (only data/out/static is packed),
      # the download cache or the repository, and this step prints none of
      # them. After the pipeline whatever it did, so a night that failed later
      # still leaves its list; it never stops the run. The organization merges
      # list is left to the next step, which saves it twice a month.
      - name: Save the review files to R2 (private)
        id: review
        if: ${{ !cancelled() && steps.pipeline.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in data/out/review/*.txt; do
            [ "$(basename "$f")" = "organization-merges.txt" ] && continue
            "$WRANGLER" r2 object put --remote "$BUCKET/review/$(basename "$f")" --file "$f" > /dev/null
          done

      # The semi-monthly organization review (operator ruling of 2026-11-07):
      # on a data date whose day is the 1st or the 16th, the merges review
      # file (the spelling groups, the candidates for the seed and the
      # registry check of each pair) goes to the private review/ prefix as
      # organization-merges-<data date>.txt, which no route on the site
      # reads; other nights it stays on the runner. org-review prints that
      # object name only when one is due and the file exists, and writes
      # "failed" as the outcome until the upload has worked; the run status
      # turns its headline counts and the object name into a notice, a line
      # of the daily check's email. It never stops the run.
      - name: Save the semi-monthly organization review to R2 (private)
        id: org_review
        if: ${{ !cancelled() && steps.pipeline.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          object=$(python -m awardwatch_pipeline.nightly org-review --db data/awardwatch.sqlite \
            --review data/out/review/organization-merges.txt --out-dir data/out/org_review)
          if [ -n "$object" ]; then
            "$WRANGLER" r2 object put --remote "$BUCKET/$object" --file data/out/review/organization-merges.txt > /dev/null
            echo "saved" > data/out/org_review/last_outcome.txt
          fi

      # The audience counts (docs/search-engines.md, section 6). Analytics
      # Engine keeps the Worker's data points for three months; this keeps
      # them for good, as one CSV per finished UTC day and one row per day in
      # views/summary.csv, both in R2. rollup-views asks the SQL API for every
      # day after the newest one the summary holds (normally only yesterday;
      # all three months on the first night), so a night that failed is caught
      # up by the next, and writes the days it rolled up to rolled_up.txt for
      # the upload loop. It reads with CLOUDFLARE_ANALYTICS_TOKEN, a token of
      # its own with Account Analytics Read and nothing else (the deploy token
      # cannot read analytics); without it the step does nothing. The
      # organization and record counts come from tonight's
      # data/out/static/stats.json. The summary is downloaded first and
      # appended to: a download that fails for any reason but "does not exist"
      # stops the step, so a summary R2 holds is never replaced by a shorter
      # one. The outcome reads "failed" until both files are in R2, so a step
      # stopped anywhere (its time limit included) reads as failed. It never
      # stops the run and needs nothing else above.
      - name: Roll up the audience counts (only when CLOUDFLARE_ANALYTICS_TOKEN is set)
        id: views
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: |
          out=data/out/views
          mkdir -p "$out"
          echo "failed" > "$out/last_outcome.txt"
          if [ -z "$CLOUDFLARE_ANALYTICS_TOKEN" ]; then
            echo "no analytics token; nothing rolled up"
            echo "no token" > "$out/last_outcome.txt"
            exit 0
          fi
          rm -f "$out/summary.csv"
          got=""
          for attempt in 1 2 3; do
            if "$WRANGLER" r2 object get --remote "$BUCKET/views/summary.csv" --file "$out/summary.csv" > "$out/summary.log" 2>&1; then
              got=yes
              break
            fi
            if grep -qi "specified key does not exist" "$out/summary.log"; then
              got=missing
              rm -f "$out/summary.csv"
              break
            fi
            sleep 20
          done
          if [ -z "$got" ]; then
            echo "views/summary.csv could not be downloaded; nothing rolled up"
            cat "$out/summary.log"
            exit 1
          fi
          python -m awardwatch_pipeline.nightly rollup-views --out "$out"
          while read -r day; do
            "$WRANGLER" r2 object put --remote "$BUCKET/views/$day.csv" --file "$out/$day.csv"
          done < "$out/rolled_up.txt"
          if [ -s "$out/rolled_up.txt" ]; then
            "$WRANGLER" r2 object put --remote "$BUCKET/views/summary.csv" --file "$out/summary.csv"
            echo "rolled up" > "$out/last_outcome.txt"
          else
            echo "no data" > "$out/last_outcome.txt"
          fi

      # The alert sign-ups (site/src/pages/interest.tsx): how many rows the
      # interest table of the forms database holds, and how many of them have
      # not unsubscribed, the landing page's Ultra card rows (kind ultra, an
      # address waiting for one message, not an alert) left out. The query
      # returns those two numbers and nothing else, so no address leaves D1. The deploy token reads D1 already (the
      # weekly snapshot exports it). Wrangler's JSON answer goes to
      # data/out/interest/count.json and never to this log, which is public.
      # The monthly audience report, kept in R2's private views/ prefix, is
      # the one place the two numbers go; the run status (interest) records
      # only whether they were read. A query that fails three times leaves
      # no file, and the status then carries a notice. It never stops the run
      # and is never an item needing attention.
      - name: Count the alert sign-ups
        id: interest
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        working-directory: site
        run: |
          out=../data/out/interest
          mkdir -p "$out"
          rm -f "$out/count.json" "$out/answer.json"
          for attempt in 1 2 3; do
            if "$WRANGLER" d1 execute award-watch --remote --json --command "SELECT COUNT(*) AS n, SUM(unsubscribed_at IS NULL) AS live FROM interest WHERE kind <> 'ultra'" > "$out/answer.json" 2> "$out/count.log"; then
              mv "$out/answer.json" "$out/count.json"
              exit 0
            fi
            sleep 20
          done
          rm -f "$out/answer.json"
          echo "The alert sign-ups could not be counted:"
          cat "$out/count.log"
          exit 1

      # The account funnel (pipeline/awardwatch_pipeline/funnel.py,
      # docs/search-engines.md section 6), for the operator only: for the last
      # finished UTC day the accounts made, the sign-in codes asked for and
      # the sign-ins, beside levels read tonight (accounts, Pro plans as the
      # operator console counts them, saved searches, watches). funnel-sql
      # prints the one statement; it returns those counts and nothing else,
      # so no address or id leaves D1, and the deploy token reads D1 already.
      # Wrangler's answer goes to a file and never to this log, which is
      # public. day.txt fixes the day once for both steps. A query that fails
      # three times leaves no file, and the next step writes n/a for the
      # counts. It never stops the run and is never an item needing attention.
      - name: Count the account funnel
        id: funnel_count
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        working-directory: site
        run: |
          out=../data/out/funnel
          mkdir -p "$out"
          rm -f "$out/count.json" "$out/answer.json"
          date -u -d yesterday +%Y-%m-%d > "$out/day.txt"
          sql=$(python -m awardwatch_pipeline.nightly funnel-sql --day "$(cat "$out/day.txt")")
          for attempt in 1 2 3; do
            if "$WRANGLER" d1 execute awardwatch-accounts --remote --json --command "$sql" > "$out/answer.json" 2> "$out/count.log"; then
              mv "$out/answer.json" "$out/count.json"
              exit 0
            fi
            sleep 20
          done
          rm -f "$out/answer.json"
          echo "The account funnel could not be counted:"
          cat "$out/count.log"
          exit 1

      # The funnel's record: views/funnel.csv, one row per finished UTC day,
      # and views/funnel_line.txt, that day's line with its audience figures
      # (people's page views, engaged, from search, phone or tablet) from the
      # summary the roll-up above left in data/out/views, n/a where it rolled
      # up nothing. The Worker's daily check adds the line to the operator's
      # email. Both stay in the private views/ prefix, which no route on the
      # site reads: the run status gets the outcome word alone, LAST_RUN.md
      # nothing, and no figure is printed here. On the night the monthly
      # report is written, the report step below puts the line again with
      # the month's figures joined on. The record is downloaded first
      # and a download that fails for any reason but "does not exist" stops
      # the step, so a shorter record never replaces it. The outcome reads
      # "failed" until both files are in R2; a failed save is a notice. It
      # never stops the run.
      - name: Save the account funnel to R2 (private)
        id: funnel
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          out=data/out/funnel
          mkdir -p "$out"
          echo "failed" > "$out/last_outcome.txt"
          [ -s "$out/day.txt" ] || date -u -d yesterday +%Y-%m-%d > "$out/day.txt"
          rm -f "$out/funnel.csv"
          got=""
          for attempt in 1 2 3; do
            if "$WRANGLER" r2 object get --remote "$BUCKET/views/funnel.csv" --file "$out/funnel.csv" > "$out/get.log" 2>&1; then
              got=yes
              break
            fi
            if grep -qi "specified key does not exist" "$out/get.log"; then
              got=missing
              rm -f "$out/funnel.csv"
              break
            fi
            sleep 20
          done
          if [ -z "$got" ]; then
            echo "views/funnel.csv could not be downloaded; nothing saved"
            cat "$out/get.log"
            exit 1
          fi
          python -m awardwatch_pipeline.nightly funnel --day "$(cat "$out/day.txt")" --accounts "$out/count.json" --summary data/out/views/summary.csv --out "$out"
          "$WRANGLER" r2 object put --remote "$BUCKET/views/funnel.csv" --file "$out/funnel.csv" > /dev/null
          "$WRANGLER" r2 object put --remote "$BUCKET/views/funnel_line.txt" --file "$out/funnel_line.txt" > /dev/null
          echo "saved" > "$out/last_outcome.txt"

      # Search Console's figures (docs/search-engines.md, section 6): clicks,
      # impressions, position and the top 50 queries of every final day after
      # the newest in views/search_console.csv, appended to it. Google keeps
      # 16 months; this keeps them for good. It signs in with the service
      # account key in GSC_SERVICE_ACCOUNT_JSON (read-only scope); without it
      # the outcome is "no credentials" and nothing is asked. The file is
      # downloaded first and appended to, and a download that fails for any
      # reason but "does not exist" stops the step, so a shorter file never
      # replaces it. The outcome reads "failed" until the file is in R2. It
      # never stops the run.
      - name: Import the Search Console figures (only when GSC_SERVICE_ACCOUNT_JSON is set)
        id: gsc
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE: ${{ vars.GSC_SITE }}
        run: |
          out=data/out/search_console
          mkdir -p "$out"
          echo "failed" > "$out/last_outcome.txt"
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "Search Console: no credentials"
            echo "no credentials" > "$out/last_outcome.txt"
            exit 0
          fi
          rm -f "$out/search_console.csv"
          got=""
          for attempt in 1 2 3; do
            if "$WRANGLER" r2 object get --remote "$BUCKET/views/search_console.csv" --file "$out/search_console.csv" > "$out/get.log" 2>&1; then
              got=yes
              break
            fi
            if grep -qi "specified key does not exist" "$out/get.log"; then
              got=missing
              rm -f "$out/search_console.csv"
              break
            fi
            sleep 20
          done
          if [ -z "$got" ]; then
            echo "views/search_console.csv could not be downloaded; nothing imported"
            cat "$out/get.log"
            exit 1
          fi
          python -m awardwatch_pipeline.nightly import-search-console --out "$out"
          outcome=$(cat "$out/outcome.txt")
          case "$outcome" in
            imported*)
              "$WRANGLER" r2 object put --remote "$BUCKET/views/search_console.csv" --file "$out/search_console.csv"
              ;;
          esac
          echo "$outcome" > "$out/last_outcome.txt"

      # The monthly audience report (docs/search-engines.md, section 6): on
      # the first run of a UTC month, views/report-<YYYY-MM>.md for the month
      # just ended, from the summary and the Search Console file as R2 holds
      # them after the two steps above, with the three months before it
      # beside it. Every night this asks R2 whether last month's report
      # exists ("not due" when it does), so a night that fails is made up by
      # the next. The report waits up to a week for the month's last day to
      # be rolled up ("waiting"). LAST_RUN.md, which is public, gets only
      # summary_line.txt: that the report was written and its R2 key. The
      # month's figures go to the operator: figures-line joins month_line.txt
      # to the line the funnel step left tonight (or, when it left none, to a
      # line dated as that step dates it), and the result replaces
      # views/funnel_line.txt, so the next morning's email carries the month
      # once. A line that cannot be joined or saved leaves the email without
      # the month; the report is in R2 and the outcome stays "written". A
      # retry the same day finds the report written ("not due"), so its
      # funnel step's line goes out without the month. Wrangler's answers to
      # the uploads go to /dev/null, and neither line is printed. It never
      # stops the run.
      - name: Write the monthly audience report (the first run of a month)
        id: report
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          out=data/out/report
          mkdir -p "$out"
          echo "failed" > "$out/last_outcome.txt"
          month=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          fetch() {
            # 0 when downloaded, 2 when R2 says it does not exist, 1 otherwise.
            local attempt
            for attempt in 1 2 3; do
              if "$WRANGLER" r2 object get --remote "$BUCKET/$1" --file "$2" > "$out/get.log" 2>&1; then return 0; fi
              if grep -qi "specified key does not exist" "$out/get.log"; then rm -f "$2"; return 2; fi
              sleep 20
            done
            cat "$out/get.log"
            return 1
          }
          code=0; fetch "views/report-$month.md" "$out/existing.md" || code=$?
          if [ "$code" = "0" ]; then echo "not due" > "$out/last_outcome.txt"; exit 0; fi
          if [ "$code" = "1" ]; then echo "views/report-$month.md could not be checked"; exit 1; fi
          code=0; fetch views/summary.csv "$out/summary.csv" || code=$?
          if [ "$code" = "1" ]; then exit 1; fi
          code=0; fetch views/search_console.csv "$out/search_console.csv" || code=$?
          if [ "$code" = "1" ]; then exit 1; fi
          python -m awardwatch_pipeline.nightly views-report --month "$month" --summary "$out/summary.csv" \
            --search "$out/search_console.csv" --interest data/out/interest/count.json --out "$out"
          outcome=$(cat "$out/outcome.txt")
          if [ "$outcome" = "written" ]; then
            "$WRANGLER" r2 object put --remote "$BUCKET/views/report-$month.md" --file "$out/report-$month.md" > /dev/null
            if python -m awardwatch_pipeline.nightly figures-line --month-line "$out/month_line.txt" \
                --day-line data/out/funnel/funnel_line.txt --day-file data/out/funnel/day.txt --out "$out/figures_line.txt" \
              && "$WRANGLER" r2 object put --remote "$BUCKET/views/funnel_line.txt" --file "$out/figures_line.txt" > /dev/null; then
              echo "the month's figures are on the operator's line for the next email"
            else
              echo "the month's figures could not be put on the operator's line; the report in R2 holds them"
            fi
          fi
          echo "$outcome" > "$out/last_outcome.txt"

      - name: Save the download cache
        if: ${{ always() && steps.pipeline.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/raw/cache
          key: raw-cache-${{ github.run_id }}

      # On the first of a month (UTC), whichever run gets there: the status
      # and expiry date of the deploy token and of the analytics token (when
      # set), through the API's token verify call, and the domain's
      # registration (expiry date, auto-renew) through the registrar API. A
      # date inside 30 days, or a token that is not active, is an attention
      # item; an answer the token has no permission for, or no answer, is
      # "unknown" and nothing more. Every other day it writes "not due". The
      # results go to the run status as checks; no token is ever printed.
      - name: Monthly expiry checks (the first of a month)
        id: checks
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: |
          mkdir -p data/out
          python -m awardwatch_pipeline.nightly checks --today "$(date -u +%Y-%m-%d)" --out data/out/checks.json

      # What the daily check in the Worker and the next retry's gate read: when
      # the run finished, which stages and steps succeeded (every step's
      # outcome under steps), the notices (information, never failures or
      # items needing attention), what the checks found, the outcomes of the
      # audience roll-up, the Search Console import, the monthly report and
      # the IndexNow submission, whether the alert sign-ups were counted
      # (interest: "counted", "failed" or "not run", never the counts), where
      # the database came from (restore), the smoke test and any rollback, and
      # the expiry checks. search_sync is the search database sync's outcome
      # ("synced", "nothing to send", "failed", or "not run" when the checks
      # before it failed); records_sync the records database sync's, the same
      # words or "no database" while the database is not created yet. intraday_lookup and intraday_prune are the same-day
      # refresh's two nightly steps ("saved" or "pruned", "failed", or "not
      # run"); a failed one is a notice, never an item needing attention.
      # intraday_lookup_bytes is the size of the lookup saved tonight (null
      # when none was), an integer beside the outcome string, which stays as
      # it was. link_sample is the link sample's outcome ("checked N, M
      # broken", "failed" or "not run") and link_sample_broken the links that
      # answered 404 or 410 (an item needing attention and a notice; a failed
      # sample is a notice). organization_review is the semi-monthly
      # organization review's outcome ("saved", "failed", "no file", "not
      # due" or "not run"); on a due night its headline counts and R2 object
      # are a notice. funnel is the account funnel save's outcome word
      # ("saved", "failed" or "not run"; a failed one is a notice) and never
      # a figure, since this step prints the status in its public log.
      # Written whatever happened above. The roll-up,
      # Search Console, report, IndexNow, rollback, the two same-day steps,
      # the link sample and the funnel save write "failed" before they start,
      # so a step stopped by its time limit still reads as failed.
      - name: Write the run status
        if: ${{ always() }}
        run: |
          python -m awardwatch_pipeline.nightly status --db data/awardwatch.sqlite \
            --started-file data/out/run_started.txt --verify data/out/verify.json \
            --views-outcome data/out/views/last_outcome.txt \
            --search-outcome data/out/search/last_outcome.txt             --records-outcome data/out/records/last_outcome.txt \
            --intraday-lookup-outcome data/out/intraday/lookup_outcome.txt \
            --intraday-lookup-bytes data/out/intraday/lookup_bytes.txt \
            --intraday-prune-outcome data/out/intraday/prune_outcome.txt \
            --link-sample-outcome data/out/links/last_outcome.txt --link-sample-broken data/out/links/broken.json \
            --org-review-outcome data/out/org_review/last_outcome.txt --org-review-summary data/out/org_review/summary.json \
            --indexnow-outcome data/out/indexnow/last_outcome.txt \
            --search-console-outcome data/out/search_console/last_outcome.txt \
            --views-report-outcome data/out/report/last_outcome.txt \
            --interest data/out/interest/count.json \
            --funnel-outcome data/out/funnel/last_outcome.txt \
            --restore data/out/restore.json --smoke data/out/deploy/smoke.json \
            --rollback-outcome data/out/deploy/rollback.txt --version-before data/out/deploy/version_before.txt \
            --checks data/out/checks.json \
            --step "restore=${{ steps.restore.outcome }}" --step "pipeline=${{ steps.pipeline.outcome }}" \
            --step "verify=${{ steps.verify.outcome }}" --step "deploy=${{ steps.deploy.outcome }}" \
            --step "save_db=${{ steps.save_db.outcome }}" --step "save_files=${{ steps.save_files.outcome }}" \
            --out data/out/status.json

      - name: Save the run status to R2
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [ -f data/out/status.json ]; then
            "$WRANGLER" r2 object put --remote "$BUCKET/status.json" --file data/out/status.json
          fi

      # main may have moved while the job ran (a code change pushed during the
      # night), so the record is put on top of it before the push. A deploy
      # the smoke test found broken is not a successful refresh. The commit
      # carries the project's own identity and a UTC timestamp, never the
      # runner's or a person's.
      - name: Record the run so the schedule stays enabled
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' && steps.smoke.outputs.verdict != 'broken' }}
        continue-on-error: true
        run: |
          date -u +"Last successful refresh: %Y-%m-%d %H:%M UTC" > LAST_RUN.md
          if [ -f data/out/views/last_outcome.txt ]; then
            echo "" >> LAST_RUN.md
            echo "Audience roll-up: $(cat data/out/views/last_outcome.txt)" >> LAST_RUN.md
          fi
          if [ -f data/out/search_console/last_outcome.txt ]; then
            echo "" >> LAST_RUN.md
            echo "Search Console: $(cat data/out/search_console/last_outcome.txt)" >> LAST_RUN.md
          fi
          # The monthly report's public line, only on the run that wrote it (or
          # tried and failed): the month and the R2 key, no figure.
          report_outcome=$(cat data/out/report/last_outcome.txt 2>/dev/null || true)
          if [ "$report_outcome" = "written" ] && [ -f data/out/report/summary_line.txt ]; then
            echo "" >> LAST_RUN.md
            echo "Audience report: $(cat data/out/report/summary_line.txt)" >> LAST_RUN.md
          elif [ "$report_outcome" = "failed" ]; then
            echo "" >> LAST_RUN.md
            echo "Audience report: failed" >> LAST_RUN.md
          fi
          if [ -f data/out/indexnow/last_outcome.txt ]; then
            echo "" >> LAST_RUN.md
            echo "IndexNow: $(cat data/out/indexnow/last_outcome.txt)" >> LAST_RUN.md
          fi
          if [ -f data/out/search/last_outcome.txt ]; then
            echo "" >> LAST_RUN.md
            echo "Search database: $(cat data/out/search/last_outcome.txt)" >> LAST_RUN.md
          fi
          if [ -f data/out/records/last_outcome.txt ]; then
            echo "" >> LAST_RUN.md
            echo "Records database: $(cat data/out/records/last_outcome.txt)" >> LAST_RUN.md
          fi
          # The run's notices, one per line with its full text (nothing when
          # there are none); a fault here leaves them out of the record only.
          python -m awardwatch_pipeline.nightly notices --status data/out/status.json > data/out/notices.md 2>/dev/null || true
          if [ -s data/out/notices.md ]; then
            echo "" >> LAST_RUN.md
            cat data/out/notices.md >> LAST_RUN.md
          fi
          git config user.name "Award Watch"
          git config user.email "ops@awardwatch.invalid"
          git add LAST_RUN.md
          if git diff --cached --quiet; then exit 0; fi
          TZ=UTC git commit -m "refresh: $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin main && git push origin HEAD:main; then exit 0; fi
            sleep 15
          done
          exit 1

      # Last, after everything is saved and recorded: fail the run when an item
      # needs attention, so GitHub's failed-workflow email reaches the operator
      # as well as the Worker's own daily check. The items (attention_items in
      # awardwatch_pipeline/resilience.py) also go to one open issue labelled
      # run-attention: the first run with items opens it, each later run
      # replaces its text and adds a comment, and the first run with none
      # closes it with a comment naming that run. The issue calls run with
      # set +e and never change the exit code, so a GitHub API fault costs the
      # issue, never the email. The label is created (or left as it is) each
      # time, so nothing has to be set up by hand. PYTHONPATH lets the helper
      # run even if the pipeline install failed. The run's notices are printed
      # in the step's log and never counted: they neither fail the step nor
      # open the issue.
      - name: Items needing attention
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: run-attention
          PYTHONPATH: ${{ github.workspace }}/pipeline
        run: |
          set +e
          out=data/out/attention
          python -m awardwatch_pipeline.nightly attention --status data/out/status.json --run-url "$RUN_URL" --out-dir "$out"
          code=$?
          soft() {
            if ! gh "$@" --repo "$GITHUB_REPOSITORY" > /dev/null; then
              echo "::warning::gh $1 $2 failed; the run-attention issue was not updated"
            fi
          }
          soft label create "$LABEL" --color B60205 --description "Opened by the nightly run while an item needs attention" --force
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -s "$out/items.txt" ]; then
            if [ -n "$open" ]; then
              soft issue edit "$open" --body-file "$out/body.md"
              soft issue comment "$open" --body-file "$out/comment.md"
            else
              soft issue create --title "$(cat "$out/title.txt")" --label "$LABEL" --body-file "$out/body.md"
            fi
          elif [ "$code" = "0" ] && [ -n "$open" ]; then
            soft issue close "$open" --reason completed --comment "$(cat "$out/close.md")"
          fi
          exit $code
