# The same-day tender notices (docs/intraday.md): between two nightly runs,
# CanadaBuys' new notices file is read again after each of its cuts and what
# it holds is written to the hosted search database (D1 awardwatch-search,
# tables intraday_tenders and intraday_runs, schema
# pipeline/intraday_schema.sql), where the site's paid view reads it.
#
# Who it runs for. The notices serve the paid plan alone, so a run goes past
# its gate only while a pro entitlement is live in the accounts database
# (D1 awardwatch-accounts). The gate counts them with one request to the D1
# REST API, before the checkout and the installs, so a run for nobody costs
# seconds. (The workflow was disabled and enabled again on 2026-11-04; the
# schedule skipped two firings after that, so this file was touched to make
# GitHub register the crons again.) No live plan, or a count that cannot be read, ends the run there:
# green, one line in the log, no run row. There is nothing to refresh for
# nobody, and while a plan is live the site's daily check names a refresh
# that has stopped going through. A manual run with the input "force" set
# runs the refresh whatever the count (for the operator's tests).
#
# When. The host regenerates newTenderNotice-nouvelAvisAppelOffres.csv every
# two hours from 06:15 to 22:15 Ottawa time (Last-Modified, measured
# 2026-11-02): 11:15 to 03:15 UTC in winter (EST), an hour earlier in summer
# (EDT). The runs are at 45 minutes past every odd hour UTC, 11:45 to 03:45:
# thirty minutes after each winter cut and ninety after each summer cut, so
# the same schedule reads every cut in both halves of the year without
# changing at the clock changes. The 03:45 run reads the day's last cut
# (22:15 Ottawa) in both halves; in summer the 01:45 run reads the 20:15 cut
# and the 03:45 run the 22:15 one. Weekends too: the host still regenerates
# the file, and a run whose file has not changed costs one short request and
# a minute of runner time. The open notices file (amendments and closing
# changes to every notice) comes once a day and is the nightly's; this job
# never reads it.
#
# Steps: count the live paid plans (the gate); read the last run's file
# validators (and the versions the table holds) from D1; fetch the file with
# a conditional request carrying them, stopping at a 304 with a run row of
# zero rows; fetch the buyer lookup the nightly saves to R2 (without it the
# buyers keep their names as published); parse and resolve (python -m
# awardwatch_pipeline.intraday refresh, with the nightly loader's own column
# map and normalizers); apply the SQL batch with wrangler d1 execute
# --remote; record the run row. No database restore: the job runs without
# the SQLite file.
#
# What a failure does: a failed cut is a row, not a red run. The fetch, the
# lookup, the parse and the apply carry continue-on-error, so a failure in
# any of them goes on to the record, which writes a run row with ok 0 and the
# step that failed, and the run stays green: GitHub sends no email for it.
# The site's daily check (06:00 UTC, site/src/watchdog.ts) is where a failure
# shows: it reads intraday_runs for the last 24 hours and names the failed
# runs, and a refresh that has not gone through for 4 hours while a paid plan
# is live. A state read that fails (the search database down, or its binding
# wrong) is green too, with no row: a run that cannot read D1 cannot write
# its row there either, so nothing after the read runs, and the daily check's
# 4-hour line is where it shows. The run goes red only when it cannot run at
# all: the secrets are missing, the checkout or an install failed, or the
# record itself could not be written. The next run sends the validators of
# the last run that went through, so it fetches the file again and writes
# every row of the day; the file is cumulative, so nothing is lost while a
# later cut comes. A notice the job never wrote comes with the next nightly,
# as it always did. The job writes nothing else: no status.json, no commit,
# no deploy, no R2 upload.
#
# --remote on every r2 and d1 command: without it Wrangler 4 reads and writes
# a local simulated store on the runner (pipeline/tests/test_intraday.py
# checks every command carries it).
#
# Secrets: the nightly's CLOUDFLARE_API_TOKEN (D1 edit, which covers the
# gate's read of the accounts database, and R2 read are what this job uses
# of it) and CLOUDFLARE_ACCOUNT_ID. Variables: SITE_URL and CONTACT, the user
# agent's site and contact page.

name: intraday

on:
  schedule:
    # 11:45, 13:45, ... 23:45 UTC, then 01:45 and 03:45 UTC: see "When" above.
    - cron: "45 11-23/2 * * *"
    - cron: "45 1-3/2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run the refresh even when no paid plan is live (for tests)"
        type: boolean
        default: false

# Reads the repository and nothing else: no commit, no issue.
permissions:
  contents: read

# A group of its own, not the nightly's: this job never waits for a refresh
# (it touches neither the database backup nor the deploy), and two of its
# own runs never overlap.
concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWARDWATCH_SITE_URL: ${{ vars.SITE_URL }}
      AWARDWATCH_CONTACT: ${{ vars.CONTACT }}
      # The accounts database (D1 awardwatch-accounts): the ACCOUNTS binding's
      # database_id in site/wrangler.jsonc. The gate names it by id because it
      # runs before the checkout, with curl rather than Wrangler.
      ACCOUNTS_DATABASE_ID: c5e21d6e-fe3c-4a3a-8d82-96e809e273b1
      # The site's pinned Wrangler (package-lock.json), like the nightly's R2
      # and D1 calls. Installed by the "site's tools" step.
      WRANGLER: ${{ github.workspace }}/site/node_modules/.bin/wrangler
      BUCKET: awardwatch-data
      OUT: ${{ github.workspace }}/data/out/intraday
    steps:
      - name: Check that the Cloudflare secrets exist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; nothing to do."
            exit 1
          fi

      # The gate (see "Who it runs for" above). The statement is the window
      # rule of planFromRows in site/src/account/entitlements.ts, counted over
      # the pro rows: not revoked, started, not ended. It is LIVE_PRO_SQL
      # there, the text the daily check prepares on the ACCOUNTS binding;
      # pipeline/tests/test_intraday.py holds the two equal, so a change to
      # one is a change to both. The instant is written as JavaScript's
      # toISOString writes it (milliseconds and a Z), because the rows' times
      # are compared as text. Any answer but a count ends the run green; the
      # step itself never fails. The count itself is never printed: the
      # repository is public, and so are its run logs. curl and jq come with
      # the runner. Every later step's condition carries this step's output.
      - name: Check for a live paid plan
        id: gate
        env:
          FORCE: ${{ inputs.force }}
          LIVE_PRO_SQL: "SELECT COUNT(*) AS n FROM entitlements WHERE plan = 'pro' AND revoked_at IS NULL AND starts_at <= ?1 AND (ends_at IS NULL OR ends_at > ?1)"
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "Forced by the manual run's input: the refresh runs whatever the count of paid plans."
            echo "active=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          body=$(jq -cn --arg sql "$LIVE_PRO_SQL" --arg at "$at" '{sql: $sql, params: [$at]}')
          code=$(curl -s -o "$RUNNER_TEMP/gate.json" -w "%{http_code}" --max-time 30 --retry 2 -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$ACCOUNTS_DATABASE_ID/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "$body") || code="none"
          n=$(jq -r 'if .success == true then (.result[0].results[0].n | numbers | tostring) else empty end' \
            "$RUNNER_TEMP/gate.json" 2>/dev/null || true)
          if [ "$code" != "200" ] || ! [[ "$n" =~ ^[0-9]+$ ]]; then
            echo "The count of live paid plans could not be read (HTTP $code); no refresh this run."
          elif [ "$n" = "0" ]; then
            echo "No paid plan is live; no refresh this run."
          else
            echo "A paid plan is live; the refresh runs."
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: ${{ steps.gate.outputs.active == 'true' }}
      - uses: actions/setup-python@v5
        if: ${{ steps.gate.outputs.active == 'true' }}
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        if: ${{ steps.gate.outputs.active == 'true' }}
        with:
          node-version: "22"
      # Editable, because config.py finds the package's data relative to its own file.
      - name: Install the pipeline
        if: ${{ steps.gate.outputs.active == 'true' }}
        run: pip install -e ./pipeline
      - name: Install the site's tools
        if: ${{ steps.gate.outputs.active == 'true' }}
        working-directory: site
        run: npm ci

      # The validators of the newest run that went through and every version
      # the table holds, in one statement (intraday.STATE_SQL). From the site
      # folder, where wrangler.jsonc names the database. A failure here (the
      # search database down, or its binding wrong) ends the run green with
      # no row: every later step needs this read, the record included, since
      # a run that cannot read D1 cannot write its row there either. The
      # daily check names it while a paid plan is live: no refresh goes
      # through for 4 hours, or the runs cannot be read at 06:00.
      - name: Read the last run from the search database
        id: state
        if: ${{ steps.gate.outputs.active == 'true' }}
        continue-on-error: true
        working-directory: site
        run: |
          mkdir -p "$OUT"
          "$WRANGLER" d1 execute awardwatch-search --remote --json --command "SELECT 'run' AS kind, file_last_modified AS a, file_etag AS b FROM (SELECT file_last_modified, file_etag FROM intraday_runs WHERE ok = 1 AND (file_last_modified IS NOT NULL OR file_etag IS NOT NULL) ORDER BY at DESC LIMIT 1) UNION ALL SELECT 'row' AS kind, reference AS a, amendment AS b FROM intraday_tenders" > "$OUT/state.json"

      # A conditional request (If-None-Match, If-Modified-Since) with the
      # pipeline's named user agent; changed=false on a 304, and the steps up
      # to the record are skipped. On a failure, too: the output is written
      # only once the file is in, so the steps that read it are skipped and
      # the record says the file could not be fetched. Only after a state read
      # that worked: under continue-on-error a failed read leaves the job a
      # success, so this condition, not the job's state, stops the run there,
      # and the lookup, the parse and the apply skip with the fetch's output.
      - name: Fetch the new notices file when it changed
        id: fetch
        if: ${{ steps.gate.outputs.active == 'true' && steps.state.outcome == 'success' }}
        continue-on-error: true
        run: python -m awardwatch_pipeline.intraday fetch --state "$OUT/state.json" --out "$OUT"

      # Tried three times; "does not exist" (no nightly has saved one yet) or
      # three failures leave no file, and the refresh then keeps every buyer
      # as published. Never fails the run: the next changed cut writes the
      # day's rows again with the lookup.
      - name: Fetch the buyer lookup from R2
        id: lookup
        if: ${{ steps.gate.outputs.active == 'true' && steps.fetch.outputs.changed == 'true' }}
        continue-on-error: true
        run: |
          rm -f "$OUT/lookup.json.gz"
          for attempt in 1 2 3; do
            if "$WRANGLER" r2 object get --remote "$BUCKET/intraday/lookup.json.gz" --file "$OUT/lookup.json.gz" > "$OUT/lookup.log" 2>&1; then
              exit 0
            fi
            rm -f "$OUT/lookup.json.gz"
            if grep -qi "specified key does not exist" "$OUT/lookup.log"; then
              echo "No buyer lookup in R2 yet; the buyers keep their names as published."
              exit 0
            fi
            sleep 10
          done
          echo "The buyer lookup could not be downloaded; the buyers keep their names as published:"
          cat "$OUT/lookup.log"

      - name: Parse the notices and write the upserts
        id: refresh
        if: ${{ steps.gate.outputs.active == 'true' && steps.fetch.outputs.changed == 'true' }}
        continue-on-error: true
        run: |
          python -m awardwatch_pipeline.intraday refresh --csv "$OUT/new.csv" --lookup "$OUT/lookup.json.gz" \
            --state "$OUT/state.json" --out "$OUT"

      # INSERT ... ON CONFLICT DO UPDATE throughout, so a batch applied twice
      # leaves the same rows. Skipped when the file held nothing to write, and
      # when the parse failed: with continue-on-error the job is still a
      # success, so this condition, not the job's state, keeps a missing or
      # partial batch from being applied.
      - name: Apply the upserts to the search database
        id: apply
        if: ${{ steps.gate.outputs.active == 'true' && steps.fetch.outputs.changed == 'true' && steps.refresh.outcome == 'success' && steps.refresh.outputs.statements != '0' }}
        continue-on-error: true
        working-directory: site
        run: |
          "$WRANGLER" d1 execute awardwatch-search --remote --yes --file "$OUT/batch.sql"

      # Whatever happened after the state was read (a run that could not read
      # D1 cannot write to it either): ok 1 when the file had not changed or
      # was applied, otherwise ok 0 and the step that failed. Each step is
      # passed by its outcome, which is "failure" for a step that failed under
      # continue-on-error (its conclusion would read "success"). The id is the
      # run and its attempt, so a re-run writes a row of its own.
      - name: Record the run
        if: ${{ !cancelled() && steps.gate.outputs.active == 'true' && steps.state.outcome == 'success' }}
        working-directory: site
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python -m awardwatch_pipeline.intraday record --run-id "$RUN_ID" --fetch "$OUT/fetch.json" \
            --refresh "$OUT/refresh.json" --step "fetch=${{ steps.fetch.outcome }}" --step "lookup=${{ steps.lookup.outcome }}" \
            --step "refresh=${{ steps.refresh.outcome }}" --step "apply=${{ steps.apply.outcome }}" --out "$OUT/run.sql"
          "$WRANGLER" d1 execute awardwatch-search --remote --yes --file "$OUT/run.sql"
